CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_DMA=y

# Expansion board peripherals (seeed_xiao_expansion_board shield, set in
# CMakeLists.txt): SSD1306 OLED over I2C, D1 button as a gpio-keys input
# device, onboard NeoPixel via the RPi-Pico-PIO WS2812 driver.
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_INPUT=y
CONFIG_LED_STRIP=y

# Self-contained USB CDC console (same setup as pico_mplay's), no -S
# snippet needed - see boards/xiao_rp2040.overlay for the devicetree side.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y
