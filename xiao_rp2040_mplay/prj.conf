# Common to every board. Board-specific settings (the audio backend's
# drivers, NeoPixel, stack protection) live in boards/<board>.conf, which
# Zephyr merges automatically for the board being built - Zephyr rejects
# assignments to symbols a board doesn't have, so they can't live here.

CONFIG_GPIO=y

# main()'s thread does the 4-channel mixer (plus, when enabled, the
# NeoPixel driver call chain) - the 1024-byte default was too tight. RAM
# headroom is large on every XIAO, so this costs nothing meaningful. The
# +256 on this and the stacks below dates from trying the RP2040's MPU
# stack guard (256-byte regions on ARMv6-M); harmless elsewhere.
CONFIG_MAIN_STACK_SIZE=4352
CONFIG_IDLE_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280
CONFIG_USBD_THREAD_STACK_SIZE=1280
CONFIG_INPUT_THREAD_STACK_SIZE=1280

# Expansion board peripherals (seeed_xiao_expansion_board shield, set in
# CMakeLists.txt): SSD1306 OLED over I2C, D1 button as a gpio-keys input
# device. The buzzer pin is described through the XIAO connector in
# expansion_board.overlay.
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_INPUT=y

# Self-contained USB CDC console (same setup as pico_mplay's), no -S
# snippet needed - see the board overlays for the devicetree side (the
# XIAO BLE's board definition already provides the CDC node).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y

# Crash diagnostics (src/diag.c): a fatal error can't be printed over the
# USB CDC console (interrupts are locked, the TX work never runs), so the
# fatal handler stores it in __noinit RAM and reboots; the next boot prints
# it together with the reset cause. The watchdog turns non-fatal hangs
# (deadlock, IRQ storm) into a reset with a WATCHDOG cause.
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_WATCHDOG=y
CONFIG_THREAD_NAME=y
