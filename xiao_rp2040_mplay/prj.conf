CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_DMA=y

# main()'s thread does the 4-channel mixer *and* now the NeoPixel driver
# call chain (led_strip_update_rgb() -> the WS2812 PIO driver's own
# internals) - the 1024-byte default was too tight for that combined
# depth, with no fault to show for it: RP2040/Cortex-M0 has no MPU stack
# guard, so overflow just silently corrupts adjacent memory instead of
# panicking - the likely cause of intermittent hangs. RAM headroom is huge
# here (264 KB total, ~26 KB used), so this costs nothing meaningful.
# STACK_SENTINEL is a cheap safety net if it's ever still too tight -
# turns a silent corruption into a clean panic instead of a mystery hang.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y

# Expansion board peripherals (seeed_xiao_expansion_board shield, set in
# CMakeLists.txt): SSD1306 OLED over I2C, D1 button as a gpio-keys input
# device, onboard NeoPixel via the RPi-Pico-PIO WS2812 driver.
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_INPUT=y
CONFIG_LED_STRIP=y

# Self-contained USB CDC console (same setup as pico_mplay's), no -S
# snippet needed - see boards/xiao_rp2040.overlay for the devicetree side.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y
