CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_DMA=y

# main()'s thread does the 4-channel mixer *and* now the NeoPixel driver
# call chain (led_strip_update_rgb() -> the WS2812 PIO driver's own
# internals) - the 1024-byte default was too tight for that combined
# depth, with no fault to show for it: RP2040/Cortex-M0 has no MPU stack
# guard, so overflow just silently corrupts adjacent memory instead of
# panicking - the likely cause of intermittent hangs. RAM headroom is huge
# here (264 KB total, ~26 KB used), so this costs nothing meaningful.
# (Stack overflow is now caught by the MPU stack guard below, which
# replaces STACK_SENTINEL - Kconfig doesn't allow both.)
CONFIG_MAIN_STACK_SIZE=4352

# Expansion board peripherals (seeed_xiao_expansion_board shield, set in
# CMakeLists.txt): SSD1306 OLED over I2C, D1 button as a gpio-keys input
# device, onboard NeoPixel via the RPi-Pico-PIO WS2812 driver.
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_INPUT=y
CONFIG_LED_STRIP=y

# Self-contained USB CDC console (same setup as pico_mplay's), no -S
# snippet needed - see boards/xiao_rp2040.overlay for the devicetree side.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y

# Crash diagnostics (src/diag.c): a fatal error can't be printed over the
# USB CDC console (interrupts are locked, the TX work never runs), so the
# fatal handler stores it in __noinit RAM and reboots; the next boot prints
# it together with the reset cause. The watchdog turns non-fatal hangs
# (deadlock, IRQ storm) into a reset with a WATCHDOG cause.
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_WATCHDOG=y
CONFIG_THREAD_NAME=y

# The M0+ does have an MPU and Zephyr supports it on RP2040 - use it as a
# real stack guard instead of relying on STACK_SENTINEL (only checked at
# context switches) to catch overflows.
#
# On ARMv6-M the guard is the minimum MPU region, 256 bytes, carved out of
# the bottom of every thread stack - so every stack gets +256 over its
# default here, or the 256-byte idle stack is left with nothing (instant
# fault on first idle -> reboot loop) and the others lose a big chunk.
# DISABLED for now: with the guard on, the board faulted/rebooted within
# the first second of boot even after the stack bumps below - cause not
# yet known. Back to STACK_SENTINEL until that's understood.
# CONFIG_ARM_MPU=y
# CONFIG_MPU_STACK_GUARD=y
CONFIG_STACK_SENTINEL=y
CONFIG_IDLE_STACK_SIZE=512
CONFIG_UDC_RPI_PICO_STACK_SIZE=768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280
CONFIG_USBD_THREAD_STACK_SIZE=1280
CONFIG_INPUT_THREAD_STACK_SIZE=1280
