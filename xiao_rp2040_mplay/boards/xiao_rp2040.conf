# XIAO RP2040 (and, via boards/xiao_rp2350_*.conf, the RP2350): the
# audio_rp2xxx.c backend - PWM slice paced DMA - and the onboard NeoPixel
# (RPi-Pico-PIO WS2812 driver).
CONFIG_PWM=y
CONFIG_DMA=y
CONFIG_LED_STRIP=y

CONFIG_UDC_RPI_PICO_STACK_SIZE=768

# Stack overflow checking. The M0+ does have an MPU and Zephyr supports it
# on RP2040, but with the guard on (256-byte regions carved from every
# stack on ARMv6-M) the board faulted/rebooted within the first second of
# boot even with the +256 stack bumps in prj.conf - cause not yet known.
# STACK_SENTINEL (checked at context switches) until that's understood:
#   CONFIG_ARM_MPU=y
#   CONFIG_MPU_STACK_GUARD=y
CONFIG_STACK_SENTINEL=y
