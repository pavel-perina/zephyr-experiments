# XIAO BLE and XIAO BLE Sense (nRF52840) - build both with -b xiao_ble: same
# MCU, flash, pins and bootloader; the Sense only adds an IMU and a PDM
# microphone, which this firmware doesn't use. (-b xiao_ble/nrf52840/sense
# would look for boards/xiao_ble_nrf52840_sense.conf/.overlay instead.)
#
# The audio_nrf.c backend drives PWM1's
# sequence playback through nrfx directly - not Zephyr's PWM driver
# (CONFIG_PWM stays off; PWM1 stays disabled in devicetree).
CONFIG_NRFX_PWM=y

# No NeoPixel on this board (vu_neopixel.c compiles to stubs), and stack
# overflow checking comes from the board's defconfig: ARM_MPU +
# HW_STACK_PROTECTION, i.e. real 32-byte MPU guards on the Cortex-M4 -
# stronger than the RP2040's STACK_SENTINEL, which it can't be combined
# with.
