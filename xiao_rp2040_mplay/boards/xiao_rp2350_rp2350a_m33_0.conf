# XIAO RP2350 (Cortex-M33 cores) - same setup as boards/xiao_rp2040.conf:
# the audio_rp2xxx.c backend (PWM slice paced DMA) and the NeoPixel.
CONFIG_PWM=y
CONFIG_DMA=y
CONFIG_LED_STRIP=y

CONFIG_UDC_RPI_PICO_STACK_SIZE=768

# Stack overflow checking: STACK_SENTINEL, as on the RP2040. The M33 has
# an ARMv8-M MPU (32-byte guard regions, unlike the M0+'s 256), so
# CONFIG_ARM_MPU + CONFIG_MPU_STACK_GUARD would likely work here and be
# stronger - untried (no RP2350 board yet).
CONFIG_STACK_SENTINEL=y
