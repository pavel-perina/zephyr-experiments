# NUCLEO-L552ZE-Q: console on LPUART1 (ST-LINK virtual COM port), so the
# USB device stack that prj.conf enables for the XIAOs' CDC console stays
# off. Merged after prj.conf; the USB options there that depend on it then
# become inactive (harmless Kconfig warnings).
CONFIG_USB_DEVICE_STACK_NEXT=n

# Buzzer: TIM2 PWM fed by DMA (audio_stm32.c).
CONFIG_PWM=y
CONFIG_DMA=y

# printk on a UART console busy-waits per character: main()'s ~130-char
# status line takes ~11 ms at 115200 baud, longer than one audio buffer
# (5.3 ms), and the render loop underran once per line. (The XIAOs' USB
# CDC console queues output, so it never showed there.) Deferred logging
# routes printk through the log buffer; the low-priority log thread does
# the actual UART output.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=2048
