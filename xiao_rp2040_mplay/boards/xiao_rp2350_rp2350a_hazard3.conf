# XIAO RP2350 on its Hazard3 (RISC-V) cores - same setup as
# boards/xiao_rp2350_rp2350a_m33.conf, minus the ARM MPU notes, and with
# the USB device stack OFF: it hangs on Hazard3 in Zephyr 4.4.2 (even the
# unmodified samples/subsys/usb/cdc_acm never enumerates; works on M33).
# The console goes to UART0 instead - see the .overlay. Merged after
# prj.conf, so this overrides its USB settings; the USB options there that
# depend on it then become inactive (harmless Kconfig warnings).
CONFIG_PWM=y
CONFIG_DMA=y
CONFIG_LED_STRIP=y

CONFIG_USB_DEVICE_STACK_NEXT=n

CONFIG_STACK_SENTINEL=y
