# Sensors on I2C (see boards/xiao_ble.overlay).
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SCD4X=y
CONFIG_SHT4X=y

# Shell on the USB CDC console (the XIAO BLE board already defines the CDC
# node as console and shell UART). `sensor get ...` comes for free with
# SENSOR_SHELL; our own commands are under `logger`.
CONFIG_SHELL=y
CONFIG_SENSOR_SHELL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y

# The data-logger lesson (see the blog post): 1024-byte default stacks
# overflow silently with shell + sensors; give all three room.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# The SCD41 offset compensation uses float maths (expf); use the M4F's FPU.
CONFIG_FPU=y
