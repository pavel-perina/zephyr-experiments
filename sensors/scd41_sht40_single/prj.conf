# Common to all boards. Board-specific settings (console transport, FPU)
# are in boards/<board>.conf, sensor wiring in boards/<board>.overlay.

# Sensors on I2C.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SCD4X=y
CONFIG_SHT4X=y

# Shell on the board's console (USB CDC on the XIAO BLE, UART0 on the
# ESP32). `sensor get ...` comes for free with SENSOR_SHELL; our own
# commands are under `logger`.
CONFIG_SHELL=y
CONFIG_SENSOR_SHELL=y
CONFIG_SERIAL=y

# The data-logger lesson (see the blog post): 1024-byte default stacks
# overflow silently with shell + sensors; give all three room.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
