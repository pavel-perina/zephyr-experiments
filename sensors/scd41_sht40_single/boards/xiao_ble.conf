# XIAO BLE: console and shell on USB CDC (the board definition already
# provides the CDC node as console and shell UART).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y

# The SCD41 offset compensation uses float maths (expf); use the M4F's FPU.
CONFIG_FPU=y
